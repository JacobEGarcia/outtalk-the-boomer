<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Outtalk the Boomer - Meeting Room Boss Battle</title>
<style>
:root{--bg:#101418;--ink:#d5e2ec;--dim:#64798c;--accent:#f59e0b;--line:#202a34;--card:#161d24}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:26px 14px}
h1{font-size:24px;letter-spacing:5px;color:var(--accent);text-transform:uppercase;text-align:center}
.sub{color:var(--dim);letter-spacing:2.5px;font-size:10.5px;text-transform:uppercase;margin-top:6px}
#boss{margin:20px 0;text-align:center}
#bossFace{font-size:64px}
#bossBar{width:min(360px,88vw);height:14px;background:var(--card);border:1px solid var(--line);border-radius:7px;margin:10px auto 0;overflow:hidden}
#bossHp{height:100%;background:var(--accent);transition:width .3s}
#hud{font-size:12px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;text-align:center;line-height:2}
#hud b{color:var(--accent)}
#dialog{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--accent);padding:16px 18px;width:min(560px,94vw);min-height:80px;font-size:13.5px;line-height:1.65}
#choices{display:grid;gap:9px;width:min(560px,94vw);margin-top:11px}
button{cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:13px 14px;font-family:inherit;font-size:13px;text-align:left;transition:border-color .15s}
button:hover{border-color:var(--accent)}
button small{display:block;color:var(--dim);font-size:11px;margin-top:3px}
#log{width:min(560px,94vw);margin-top:14px;font-size:11.5px;color:var(--dim);line-height:1.75;text-align:center}
</style>
</head>
<body>
<h1>Outtalk the Boomer</h1>
<div class="sub">a meeting-room boss battle &middot; no fists, only rhetoric</div>
<div id="boss"><div id="bossFace">👴</div><div id="bossBar"><div id="bossHp" style="width:100%"></div></div></div>
<div id="hud"></div>
<div id="dialog"></div>
<div id="choices"></div>
<div id="log"></div>
<script>
const $=id=>document.getElementById(id);
const S={hp:100,patience:100,round:1,over:false};
const ATTACKS=[
 ['Back in my day, we bought houses on ONE income.',[['Cite price-to-income ratios, calmly','dmg 22',22],['Nod and say "wild times"','dmg 8, patience -4',8],['Ask how much his degree cost','dmg 30, risky',30]]],
 ['Nobody wants to work anymore.',[['Point at the three jobs you currently hold','dmg 25',25],['Sigh audibly','dmg 6',6],['Ask what "work" means to him','dmg 18, philosophical',18]]],
 ['You kids and your avocados.',[['Present a detailed brunch budget spreadsheet','dmg 24',24],['Offer him a bite of the toast','dmg 12, disarming',12],['Concede the toast is, in fact, great','dmg 5, patience +6',5]]],
 ['Just walk in and give the manager a firm handshake.',[['Explain that the manager is an algorithm now','dmg 26',26],['Demonstrate your handshake','dmg 10, respectful',10],['Ask when he last applied for a job','dmg 20',20]]],
 ['The Wi-Fi is a conspiracy against this house.',[['Fix the router while he watches','dmg 28, legend status',28],['Suggest turning it off and on','dmg 15',15],['Agree it is suspicious','dmg 4',4]]]];
function clamp(x){return Math.max(0,Math.min(100,x))}
function hud(){$('hud').innerHTML='ROUND <b>'+S.round+'</b> &middot; YOUR PATIENCE <b>'+S.patience+'%</b>';
 $('bossHp').style.width=S.hp+'%';
 $('bossFace').textContent=S.hp>66?'👴':S.hp>33?'🤨':'😳';}
function log(t,c){const d=document.createElement('div');d.textContent=t;if(c)d.style.color=c;$('log').prepend(d);}
function render(){
 hud();if(S.over)return;
 const a=ATTACKS[Math.floor(Math.random()*ATTACKS.length)];
 $('dialog').innerHTML='<b>The Boomer says:</b> "'+a[0]+'"';
 $('choices').innerHTML='';
 a[1].forEach(o=>{
  const b=document.createElement('button');
  b.innerHTML=o[0]+'<small>'+o[1]+'</small>';
  b.onclick=()=>{
   S.hp-=o[2];S.patience-=8;S.hp=clamp(S.hp);S.patience=clamp(S.patience);
   log('Round '+S.round+': "'+o[0]+'" dealt '+o[2]+' rhetorical damage.');
   S.round++;
   if(S.hp<=0){end(true,'The Boomer leans back. "...You make some fair points, kid." He asks you to fix his phone. You have won, and the prize is tech support forever.');}
   else if(S.patience<=0){end(false,'Your patience hits zero. You excuse yourself to "get water" and simply leave the state. The Boomer remains undefeated at Thanksgiving.');}
   else render();};
  $('choices').appendChild(b);});}
function end(win,msg){S.over=true;$('dialog').innerHTML='<b>'+(win?'VICTORY':'RETREAT')+'</b> - '+msg;
 $('choices').innerHTML='';const b=document.createElement('button');
 b.textContent='ANOTHER FAMILY DINNER';b.onclick=()=>{Object.assign(S,{hp:100,patience:100,round:1,over:false});$('log').innerHTML='';render();};
 $('choices').appendChild(b);log(msg,win?'var(--accent)':'#f87171');}
render();
</script>
</body>
</html>
